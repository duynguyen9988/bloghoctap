<header class="sticky top-0 z-40 border-b border-slate-200 bg-white/90 backdrop-blur dark:border-slate-800 dark:bg-slate-900/90">
  <nav class="container mx-auto flex h-14 max-w-4xl items-center justify-between gap-4" aria-label="Điều hướng chính">
    <a href="{{ site.Home.RelPermalink }}" class="flex shrink-0 items-center gap-2 text-base font-bold tracking-tight text-slate-900 dark:text-white">
      <span class="flex h-7 w-7 items-center justify-center rounded-lg bg-blue-600 text-sm font-black text-white dark:bg-blue-500">b</span>
      <span class="hidden sm:inline">{{ site.Title }}</span>
    </a>

    <div class="flex items-center gap-1 sm:gap-2">
      {{- range site.Menus.main }}
        <a href="{{ .URL | relURL }}"
           class="nav-link{{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }} nav-link-active{{ end }}"
           {{ if not (eq (site.BaseURL) "") }}data-base="{{ site.BaseURL }}"{{ end }}>
          {{ .Name }}
        </a>
      {{- end }}
    </div>

    <div class="flex shrink-0 items-center gap-1">
      {{ if site.Params.search.enable }}
        <button type="button" class="icon-btn" id="search-open" aria-expanded="false" aria-controls="search-dialog" aria-label="Mở tìm kiếm" onclick="toggleSearch(true)">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 10.5a6.5 6.5 0 11-13 0 6.5 6.5 0 0113 0z" />
          </svg>
        </button>
      {{ end }}

      <button type="button" class="icon-btn" id="theme-toggle" aria-label="Chuyển đổi chế độ sáng/tối" title="Chuyển chế độ sáng/tối">
        <svg id="theme-sun" xmlns="http://www.w3.org/2000/svg" class="hidden h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2m0 14v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M3 12h2m14 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41M12 8a4 4 0 100 8 4 4 0 000-8z" />
        </svg>
        <svg id="theme-moon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20.35 15.35A8.5 8.5 0 018.65 3.65 8.5 8.5 0 1020.35 15.35z" />
        </svg>
      </button>
    </div>
  </nav>
</header>
