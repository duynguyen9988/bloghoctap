{{ define "main" }}
<header class="border-b border-slate-200 bg-slate-50 dark:border-slate-800 dark:bg-slate-800/50">
  <div class="container mx-auto max-w-4xl py-14 sm:py-20">
    <h1 class="text-3xl font-bold tracking-tight text-slate-900 sm:text-5xl dark:text-white">{{ site.Title }}</h1>
    <p class="mt-4 max-w-xl text-base text-slate-600 sm:text-lg dark:text-slate-300">{{ site.Params.description }}</p>
  </div>
</header>

<section class="container mx-auto max-w-4xl py-10">
  <h2 class="text-sm font-semibold uppercase tracking-widest text-slate-400 dark:text-slate-500">Bài viết mới</h2>
  <div class="mt-6 grid gap-5">
    {{- $posts := where site.RegularPages "Section" "eq" "posts" -}}
    {{- range (.Paginate $posts).Pages }}
      {{ partial "card.html" . }}
    {{- end }}
  </div>
  {{ partial "pagination.html" . }}
</section>
{{ end }}
