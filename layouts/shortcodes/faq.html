{{- $faq := .Page.Params.faq -}}
{{- if $faq }}
<section class="mt-12 rounded-2xl border border-slate-200 p-5 dark:border-slate-800" aria-labelledby="faq-heading">
  <h2 id="faq-heading" class="flex items-center gap-2 text-base font-bold tracking-tight text-slate-900 dark:text-white">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-blue-600 dark:text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
    Hỏi &amp; đáp liên quan
  </h2>
  <div class="mt-4 space-y-3">
    {{- range $faq }}
    <details class="group rounded-xl border border-slate-200 px-4 py-3 open:bg-slate-50 dark:border-slate-800 dark:open:bg-slate-900/50">
      <summary class="flex cursor-pointer list-none items-center justify-between gap-3 text-sm font-semibold text-slate-800 dark:text-slate-200">
        {{ .q | markdownify }}
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0 text-slate-400 transition-transform duration-200 group-open:rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
        </svg>
      </summary>
      <div class="mt-2 text-sm leading-relaxed text-slate-600 dark:text-slate-300">
        {{ .a | markdownify }}
      </div>
    </details>
    {{- end }}
  </div>
</section>
{{- end -}}
