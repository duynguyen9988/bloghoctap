{{- if not (.Page.Store.Get "mermaid-inited") -}}
  {{- .Page.Store.Set "mermaid-inited" true -}}
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
{{- end -}}
<div class="my-6 overflow-x-auto rounded-xl border border-slate-200 bg-white p-4 dark:border-slate-700">
  <pre class="mermaid">{{ .Inner }}</pre>
</div>
