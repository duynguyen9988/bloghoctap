{{ define "main" }}
<header class="border-b border-slate-200 dark:border-slate-800">
  <div class="container mx-auto max-w-4xl py-10">
    <h1 class="text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl dark:text-white">{{ .Title }}</h1>
    {{- with .Content }}
      <div class="prose-blog mt-4">{{ . }}</div>
    {{- end }}
    {{- if not .IsHome }}
      <p class="mt-3 text-sm text-slate-500 dark:text-slate-400">
        {{- len .RegularPages }} bài viết{{ with .Params.subtitle }} — {{ . }}{{ end -}}
      </p>
    {{- end }}
  </div>
</header>

<section class="container mx-auto max-w-4xl py-10">
  <div class="flex flex-wrap gap-2">
    {{- range .Pages.ByTitle }}
      <a href="{{ .RelPermalink }}" class="chip px-3.5 py-1.5 text-sm">
        {{ .Title }}
        <span class="ml-1 text-xs font-normal text-slate-500 dark:text-slate-400">{{ len .Pages }}</span>
      </a>
    {{- end }}
  </div>
</section>
{{ end }}
